name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fixture_ci
          POSTGRES_PASSWORD: fixture-ci-only
          POSTGRES_DB: fixture_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fixture_ci -d fixture_ci"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      CHEETA_TEST_DATABASE_URL: postgresql+psycopg://fixture_ci:fixture-ci-only@127.0.0.1:5432/fixture_ci
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked --python 3.12
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: backend/agents/a03/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend/agents/a03
      - run: npm run check && npm test
        working-directory: backend/agents/a03
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest
      - run: uv run python scripts/export_contract_schema.py --check
      - run: uv run python scripts/export_http_schema.py --check
      - run: uv run python scripts/export_search_schema.py --check
      - run: uv run python scripts/export_a03_schema.py --check

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
