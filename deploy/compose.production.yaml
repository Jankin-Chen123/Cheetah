name: cheetah

x-application: &application
  image: ${CHEETAH_BACKEND_IMAGE:?Set an immutable backend image}
  restart: unless-stopped
  env_file: .env
  environment:
    CHEETA_ENVIRONMENT: production
    CHEETA_ALLOW_MOCK: "false"
    CHEETA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
  init: true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?}
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "max_connections=30"]
    mem_limit: 256m
    cpus: 0.5
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    <<: *application
    mem_limit: 256m
    cpus: 0.75
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 20s
      retries: 4

  worker:
    <<: *application
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    mem_limit: 512m
    cpus: 0.75

  interview-worker:
    <<: *application
    command: ["/app/.venv/bin/python", "scripts/run_interview_worker.py"]
    mem_limit: 256m
    cpus: 0.5

  frontend:
    image: ${CHEETAH_FRONTEND_IMAGE:?Set an immutable frontend image}
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    environment:
      NGINX_WORKER_PROCESSES: "1"
    ports:
      - "127.0.0.1:${CHEETAH_HTTP_PORT:-18080}:80"
    volumes:
      - ./brand:/usr/share/nginx/html/brand:ro
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 4
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
