[project]
name = "cheetah-backend"
version = "0.1.0"
description = "Cheetah headhunter workflow backend scaffold"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "json-repair>=0.30,<1",
  "olefile>=0.47,<0.48",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.8,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
  "websockets>=17,<18",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.23,<5",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::sqlalchemy.exc.SAWarning"]
