services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    environment: &backend_environment
      CHEETA_ENVIRONMENT: ${CHEETA_ENVIRONMENT:-development}
      CHEETA_ALLOWED_ORIGINS: '${CHEETA_ALLOWED_ORIGINS:-["http://localhost:5173","http://127.0.0.1:5173","http://localhost:8080","http://127.0.0.1:8080"]}'
      CHEETA_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      CHEETA_ALLOW_MOCK: ${CHEETA_ALLOW_MOCK:-false}
      CHEETA_JOB_MODEL_CALL_LIMIT: ${CHEETA_JOB_MODEL_CALL_LIMIT:-30}
      CHEETA_JOB_MODEL_TOKEN_LIMIT: ${CHEETA_JOB_MODEL_TOKEN_LIMIT:-300000}
      CHEETA_MODEL_ENDPOINT: ${CHEETA_MODEL_ENDPOINT:-}
      CHEETA_MODEL_NAME: ${CHEETA_MODEL_NAME:-}
      CHEETA_MODEL_API_KEY: ${CHEETA_MODEL_API_KEY:-}
      CHEETA_MODEL_MAX_OUTPUT_TOKENS: ${CHEETA_MODEL_MAX_OUTPUT_TOKENS:-16000}
      CHEETA_MODEL_TIMEOUT_SECONDS: ${CHEETA_MODEL_TIMEOUT_SECONDS:-30}
      CHEETA_SEARCH_PROVIDER: ${CHEETA_SEARCH_PROVIDER:-disabled}
      CHEETA_SEARCH_ENDPOINT: ${CHEETA_SEARCH_ENDPOINT:-}
      CHEETA_SEARCH_API_KEY: ${CHEETA_SEARCH_API_KEY:-}
      CHEETA_SEARCH_ALLOWED_DOMAINS: "${CHEETA_SEARCH_ALLOWED_DOMAINS:-[]}"
      CHEETA_JOB_SEARCH_CALL_LIMIT: ${CHEETA_JOB_SEARCH_CALL_LIMIT:-20}
      CHEETA_RESEARCH_QUERY_LIMIT: ${CHEETA_RESEARCH_QUERY_LIMIT:-2}
      CHEETA_SEARCH_RESULT_LIMIT: ${CHEETA_SEARCH_RESULT_LIMIT:-5}
      CHEETA_A03_WEB_BACKEND: ${CHEETA_A03_WEB_BACKEND:-disabled}
      CHEETA_A03_PLUGIN_PROVIDER: ${CHEETA_A03_PLUGIN_PROVIDER:-brave}
      CHEETA_A03_PLUGIN_API_KEY: ${CHEETA_A03_PLUGIN_API_KEY:-}
      CHEETA_A03_PLUGIN_BASE_URL: ${CHEETA_A03_PLUGIN_BASE_URL:-}
      CHEETA_A03_FETCH_ENDPOINT: ${CHEETA_A03_FETCH_ENDPOINT:-}
      CHEETA_A03_MAX_TURNS: ${CHEETA_A03_MAX_TURNS:-16}
      CHEETA_A03_MAX_SEARCHES: ${CHEETA_A03_MAX_SEARCHES:-12}
      CHEETA_A03_MAX_PAGES: ${CHEETA_A03_MAX_PAGES:-12}
      CHEETA_A03_PER_OBJECT_SEARCHES: ${CHEETA_A03_PER_OBJECT_SEARCHES:-3}
      CHEETA_A03_MAX_SECONDS: ${CHEETA_A03_MAX_SECONDS:-300}
      CHEETA_TEXT_PROVIDER: ${CHEETA_TEXT_PROVIDER:-bailian}
      CHEETA_BAILIAN_API_KEY: ${CHEETA_BAILIAN_API_KEY:-}
      CHEETA_BAILIAN_BASE_URL: ${CHEETA_BAILIAN_BASE_URL:-}
      CHEETA_BAILIAN_MODEL: ${CHEETA_BAILIAN_MODEL:-qwen-plus}
      CHEETA_ARK_API_KEY: ${CHEETA_ARK_API_KEY:-}
      CHEETA_ARK_BASE_URL: ${CHEETA_ARK_BASE_URL:-https://ark.cn-beijing.volces.com/api/v3}
      CHEETA_ARK_MODEL: ${CHEETA_ARK_MODEL:-doubao-seed-2-1-lite-260915}
      CHEETA_ARK_EMBEDDING_MODEL: ${CHEETA_ARK_EMBEDDING_MODEL:-doubao-embedding-vision-251215}
      CHEETA_ARK_EMBEDDING_API: ${CHEETA_ARK_EMBEDDING_API:-multimodal}
      CHEETA_VOICE_PROVIDER: ${CHEETA_VOICE_PROVIDER:-bailian}
      CHEETA_VOLC_SPEECH_API_KEY: ${CHEETA_VOLC_SPEECH_API_KEY:-}
      CHEETA_VOLC_ASR_RESOURCE_ID: ${CHEETA_VOLC_ASR_RESOURCE_ID:-volc.seedasr.sauc.duration}
      CHEETA_VOLC_TTS_RESOURCE_ID: ${CHEETA_VOLC_TTS_RESOURCE_ID:-seed-tts-2.0}
      CHEETA_VOLC_CUSTOM_VOICE_RESOURCE_ID: ${CHEETA_VOLC_CUSTOM_VOICE_RESOURCE_ID:-seed-icl-2.0}
      CHEETA_TTS_CUSTOM_VOICE_ID: ${CHEETA_TTS_CUSTOM_VOICE_ID:-}
      CHEETA_TTS_CUSTOM_VOICE_LABEL: ${CHEETA_TTS_CUSTOM_VOICE_LABEL:-自定义音色}
      CHEETA_TTS_MODEL: ${CHEETA_TTS_MODEL:-qwen-audio-3.1-tts-flash}
      CHEETA_DIALOGUE_UNDERSTANDING_ENABLED: ${CHEETA_DIALOGUE_UNDERSTANDING_ENABLED:-false}
      CHEETA_MODEL_MAX_TOKENS: ${CHEETA_MODEL_MAX_TOKENS:-2000}
      CHEETA_EXTRACTION_MAX_TOKENS: ${CHEETA_EXTRACTION_MAX_TOKENS:-4000}
      CHEETA_MODEL_MAX_REQUESTS_PER_CASE: ${CHEETA_MODEL_MAX_REQUESTS_PER_CASE:-24}
      CHEETA_RETRIEVAL_MIN_SIMILARITY: ${CHEETA_RETRIEVAL_MIN_SIMILARITY:-0.35}
      CHEETA_SMTP_HOST: ${CHEETA_SMTP_HOST:-}
      CHEETA_SMTP_PORT: ${CHEETA_SMTP_PORT:-465}
      CHEETA_SMTP_USERNAME: ${CHEETA_SMTP_USERNAME:-}
      CHEETA_SMTP_PASSWORD: ${CHEETA_SMTP_PASSWORD:-}
      CHEETA_SMTP_SENDER: ${CHEETA_SMTP_SENDER:-}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build: ./backend
    restart: unless-stopped
    environment: *backend_environment
    command: ["/app/.venv/bin/python", "-m", "app.worker"]
    depends_on:
      db:
        condition: service_healthy

  interview-worker:
    build: ./backend
    restart: unless-stopped
    environment: *backend_environment
    command: ["/app/.venv/bin/python", "scripts/run_interview_worker.py"]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
